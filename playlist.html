<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>My Playlists — Touhou Music Player</title>
  <link rel="icon" href="TH Reimu NOBG.ico" sizes="128x128" type="image/x-icon">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore-compat.js"></script>

  <link rel="stylesheet" href="music.css">
  <link rel="stylesheet" href="playlist-spotify.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>

<body class="playlist-page">
  <div class="bg-animation"></div>

  <!-- Profile Dropdown -->
  <div class="profile-container" id="profileContainer" style="display: none;">
    <div class="profile-dropdown">
      <button class="profile-btn" id="profileToggle">
        <span class="user-name" id="userFirstName">User</span>
        <i class="fas fa-chevron-down"></i>
      </button>
      <div class="dropdown-content" id="dropdownMenu">
        <button id="backToPlayer"><i class="fas fa-home"></i> Back to Player</button>
        <button id="profileSettings"><i class="fas fa-user-cog"></i> Profile Settings</button>
        <button id="signOutBtn"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
      </div>
    </div>
  </div>

  <!-- Header -->
<header class="playlist-hero">
  <div class="container playlist-hero-inner">
    <div class="playlist-hero-text">
      <span class="playlist-hero-eyebrow">Your Library</span>
      <h1 class="playlist-hero-title">My Playlists</h1>
      <p class="playlist-hero-sub">Curate, play, and download your favourite Touhou tracks.</p>
    </div>
  </div>
</header>

  <!-- Main content -->
  <main class="playlist-main container">
    <!-- Spotify-style grid (populated by playlist-spotify-new.js) -->
    <div class="playlist-grid" id="playlistsGrid"></div>

    <!-- Hidden legacy container (kept so nothing else breaks) -->
    <div id="playlistsContainer" class="row" style="display:none"></div>
    <div id="noPlaylists" style="display:none"></div>

    <!-- Inline playlist view (kept hidden; fullscreen handles it) -->
    <section id="currentPlaylistSection" class="current-playlist-section" style="display:none">
      <div class="current-playlist-head">
        <h3 id="currentPlaylistTitle">Playlist Tracks</h3>
        <button id="backToPlaylists" class="btn-ghost">
          <i class="fas fa-arrow-left"></i> Back
        </button>
      </div>
      <div id="currentPlaylistTracks" class="row"></div>
    </section>
  </main>

  <!-- Fullscreen playlist view -->
  <div class="playlist-fullscreen" id="playlistFullscreen" aria-hidden="true">
    <button class="close-fullscreen" id="closeFullscreen" aria-label="Close">
      <i class="fas fa-times"></i>
    </button>

    <div class="playlist-fullscreen-scroll">
      <div class="playlist-header">
        <div class="playlist-cover-wrap">
          <img class="playlist-cover-large" id="fullscreenCover" src="" alt="">
          <span class="playlist-cover-glow"></span>
        </div>
        <div class="playlist-header-info">
          <span class="playlist-header-eyebrow">Playlist</span>
          <h1 class="playlist-title-large" id="fullscreenTitle">Playlist Name</h1>
          <div class="playlist-stats" id="fullscreenStats">0 tracks</div>
          <div class="playlist-header-actions">
            <button class="header-action-btn play" id="playFullscreenPlaylist">
              <i class="fas fa-play"></i> Play
            </button>
            <button class="header-action-btn secondary" id="downloadFullscreenPlaylist">
              <i class="fas fa-download"></i> Download
            </button>
            <button class="header-action-btn secondary" id="renameFullscreenPlaylist">
              <i class="fas fa-edit"></i> Rename
            </button>
            <button class="header-action-btn secondary danger" id="deleteFullscreenPlaylist">
              <i class="fas fa-trash"></i> Delete
            </button>
          </div>
        </div>
      </div>

      <div class="playlist-tracks-container" id="fullscreenTracks"></div>
    </div>
  </div>

  <!-- Player bar -->
  <div class="player-bar" role="region" aria-label="Music player">
    <div class="player-left" id="openBig" title="Open big player">
      <img id="miniCover" class="player-cover" src="" alt="">
      <div class="song-meta">
        <div class="song-title-container"><div id="songTitleInner">Select a song</div></div>
        <div id="songArtist" class="song-artist">—</div>
      </div>
    </div>

    <div class="player-center">
      <div class="controls">
        <button id="shuffle" class="control-btn" title="Shuffle">🔀</button>
        <button id="prev" class="control-btn" title="Previous">⏮</button>
        <button id="play" class="control-btn" title="Play">▶</button>
        <button id="next" class="control-btn" title="Next">⏭</button>
        <button id="loop" class="control-btn" title="Loop">🔁</button>
        <button id="downloadBtn" title="Download" style="display:none;" class="control-btn">
          <span class="material-symbols-outlined">download</span>
        </button>
        <button class="playlist-btn control-btn" title="Add to playlist">
          <i class="fas fa-plus"></i>
        </button>
        <div class="volume-container">
          <button id="muteBtn" title="Mute / Unmute" class="control-btn">
            <i class="fa fa-volume-up"></i>
          </button>
          <div class="volume-slider-wrapper">
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100">
          </div>
        </div>
      </div>
      <div class="progress-wrap">
        <div id="curTime" class="time">0:00</div>
        <div id="progress" aria-label="progress bar">
          <div id="progressBar"></div>
          <div id="thumb" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        </div>
        <div id="durTime" class="time">0:00</div>
      </div>
    </div>
  </div>

  <!-- Big player overlay -->
  <div id="bigPlayer" class="big-player-overlay" aria-hidden="true">
    <button id="closeBigPlayer" class="big-close-btn" title="Close">✕</button>
    <div class="big-cover"><img id="bigPlayerCover" src="" alt=""></div>
    <div id="bigPlayerTitle" class="big-title">—</div>
    <div id="bigPlayerArtist" class="big-artist">—</div>
    <div class="big-controls">
      <div class="controls" style="flex-wrap: wrap; justify-content: center; gap: 10px;">
        <button id="bigShuffle" class="control-btn" title="Shuffle">🔀</button>
        <button id="bigPrev" class="control-btn" title="Previous">⏮</button>
        <button id="bigPlay" class="control-btn" title="Play">▶</button>
        <button id="bigNext" class="control-btn" title="Next">⏭</button>
        <button id="bigLoop" class="control-btn" title="Loop">🔁</button>
        <button id="bigDownloadBtn" title="Download" style="display:none;" class="control-btn">
          <span class="material-symbols-outlined">download</span>
        </button>
        <button class="big-playlist-btn control-btn" title="Add to playlist">
          <i class="fas fa-plus"></i>
        </button>
        <div class="volume-container">
          <button id="bigMuteBtn" title="Mute / Unmute" class="control-btn">
            <i class="fa fa-volume-up"></i>
          </button>
          <div class="volume-slider-wrapper">
            <input type="range" class="volume-slider" id="bigVolumeSlider" min="0" max="100" value="100">
          </div>
        </div>
      </div>
      <div class="big-progress-wrap">
        <div id="bigCurTime" class="time">0:00</div>
        <div id="bigProgress" class="big-progress">
          <div id="bigProgressBar" class="big-progress-bar"></div>
          <div id="bigThumb" class="big-thumb" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        </div>
        <div id="bigDurTime" class="time">0:00</div>
      </div>
    </div>
  </div>

  <audio id="audioEl" preload="metadata"></audio>

  <!-- Create playlist modal (only used as fallback) -->
  <div class="modal fade create-playlist-modal" id="createPlaylistModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Create New Playlist</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <label for="newPlaylistNameModal" class="form-label">Playlist Name</label>
          <input type="text" class="form-control" id="newPlaylistNameModal"
                 placeholder="e.g. Scarlet Devil Mansion" maxlength="50" autocomplete="off">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="createPlaylistModalBtn">Create</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="firebase-config.js"></script>
  <script src="media-url-helper.js"></script>
  <script src="user-auth-playlist.js"></script>
  <script src="playlist-manager.js"></script>
  <script src="music.js"></script>
  <script src="playlist-spotify.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Hero create button (opens the same modal the enhancer uses)
      document.getElementById('heroCreateBtn')?.addEventListener('click', () => {
        if (window.spotifyEnhancer?.showCreatePlaylistModal) {
          window.spotifyEnhancer.showCreatePlaylistModal();
        } else {
          new bootstrap.Modal(document.getElementById('createPlaylistModal')).show();
        }
      });

      // Modal fallback create
      document.getElementById('createPlaylistModalBtn')?.addEventListener('click', () => {
        const input = document.getElementById('newPlaylistNameModal');
        const name = input?.value.trim();
        if (!name) return alert('Please enter a playlist name');
        if (window.spotifyEnhancer?.createPlaylistFromModal) {
          window.spotifyEnhancer.createPlaylistFromModal();
        } else if (window.playlistManagerFixed?.createPlaylistFromModal) {
          window.playlistManagerFixed.createPlaylistFromModal();
        }
      });
    });
  </script>
</body>
</html>
