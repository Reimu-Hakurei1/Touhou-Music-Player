<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>My Playlists - Touhou Music Player</title>
  <link rel="icon" href="TH Reimu NOBG.ico" sizes="128x128" type="image/x-icon">
  
  <!-- Libraries -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  
  <!-- Firebase COMPAT Version -->
  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore-compat.js"></script>
  
  <!-- Styles -->
  <link rel="stylesheet" href="music.css">
  <link rel="stylesheet" href="playlist-spotify.css">

  <!-- Add this style block for z-index fix -->
  <style>
    .player-bar {
      z-index: 2000 !important; /* Higher than fullscreen */
      position: fixed !important;
      bottom: 0 !important;
      width: 100% !important;
    }
    .playlist-fullscreen {
      z-index: 1000 !important; /* Lower than player bar */
    }
  </style>

  <!-- JSZip and FileSaver for downloads -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>

<body>
  <div class="bg-animation"></div>

  <!-- Profile Dropdown -->
  <div class="profile-container" id="profileContainer" style="display: none;">
    <div class="profile-dropdown">
      <button class="profile-btn" id="profileToggle">
        <span class="user-name" id="userFirstName">User</span>
        <i class="fas fa-chevron-down"></i>
      </button>
      <div class="dropdown-content" id="dropdownMenu">
        <button id="backToPlayer">
          <i class="fas fa-home"></i>
          Back to Player
        </button>
        <button id="profileSettings">
          <i class="fas fa-user-cog"></i>
          Profile Settings
        </button>
        <button id="signOutBtn">
          <i class="fas fa-sign-out-alt"></i>
          Sign Out
        </button>
      </div>
    </div>
  </div>

  <!-- Fixed Header Section -->
  <div class="fixed-header" id="fixedHeader">
    <div class="container">
      <h1 class="page-title">My Playlists</h1>
    </div>
  </div>

  <!-- Playlist Management Section -->
  <main class="music-section container">
    <div class="content-spacer"></div>
    
    <!-- Playlists Grid -->
    <div class="playlist-grid" id="playlistsGrid">
      <!-- Playlists will be loaded here by Spotify enhancer -->
    </div>

    <!-- Original Playlists Container (hidden by Spotify CSS) -->
    <div id="playlistsContainer" class="row">
      <!-- Playlists will be loaded here by original manager -->
    </div>

    <!-- No Playlists Message -->
    <div id="noPlaylists" class="text-center" style="display: none;">
      <div class="empty-state">
        <i class="fas fa-list-music fa-3x mb-3 text-muted"></i>
        <h4>No Playlists Yet</h4>
        <p class="text-muted">Create your first playlist to get started!</p>
      </div>
    </div>

    <!-- Current Playlist Tracks Section -->
    <div id="currentPlaylistSection" class="mt-4" style="display: none;">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 id="currentPlaylistTitle">Playlist Tracks</h3>
        <button id="backToPlaylists" class="btn btn-outline-secondary">
          <i class="fas fa-arrow-left me-2"></i>Back to Playlists
        </button>
      </div>
      <div id="currentPlaylistTracks" class="row">
        <!-- Playlist tracks will be loaded here -->
      </div>
    </div>
  </main>

  <!-- Fullscreen Playlist View -->
  <div class="playlist-fullscreen" id="playlistFullscreen">
    <button class="close-fullscreen" id="closeFullscreen">
      <i class="fas fa-times"></i>
    </button>
    
    <div class="playlist-header">
      <img class="playlist-cover-large" id="fullscreenCover" src="" alt="Playlist Cover">
      <div class="playlist-header-info">
        <div class="playlist-title-large" id="fullscreenTitle">Playlist Name</div>
        <div class="playlist-stats" id="fullscreenStats">0 tracks</div>
        <div class="playlist-header-actions">
          <button class="header-action-btn play" id="playFullscreenPlaylist">
            <i class="fas fa-play"></i>
            Play
          </button>
          <button class="header-action-btn secondary" id="downloadFullscreenPlaylist">
            <i class="fas fa-download"></i>
            Download
          </button>
          <button class="header-action-btn secondary" id="renameFullscreenPlaylist">
            <i class="fas fa-edit"></i>
            Rename
          </button>
          <button class="header-action-btn secondary" id="deleteFullscreenPlaylist">
            <i class="fas fa-trash"></i>
            Delete
          </button>
        </div>
      </div>
    </div>
    
    <div class="playlist-tracks-container" id="fullscreenTracks">
      <!-- Tracks will be loaded here -->
    </div>
  </div>

  <!-- Player Bar -->
  <div class="player-bar" role="region" aria-label="Music player">
    <div class="player-left" id="openBig" title="Open big player">
      <img id="miniCover" class="player-cover" src="" alt="">
      <div class="song-meta">
        <div class="song-title-container">
          <div id="songTitleInner">Select a song</div>
        </div>
        <div id="songArtist" class="song-artist">—</div>
      </div>
    </div>
  
    <div class="player-center">
      <div class="controls">
        <button id="shuffle" class="control-btn" title="Shuffle">🔀</button>
        <button id="prev" class="control-btn" title="Previous">⏮</button>
        <button id="play" class="control-btn" title="Play">▶</button>
        <button id="next" class="control-btn" title="Next">⏭</button>
        <button id="loop" class="control-btn" title="Loop">🔁</button>
        <button id="downloadBtn" title="Download" style="display:none;" class="control-btn">
          <span class="material-symbols-outlined">download</span>
        </button>
        <button class="playlist-btn control-btn" title="Add to playlist">
          <i class="fas fa-plus"></i>
        </button>
        <div class="volume-container">
          <button id="muteBtn" title="Mute / Unmute" class="control-btn">
            <i class="fa fa-volume-up"></i>
          </button>
          <div class="volume-slider-wrapper">
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100" 
                   aria-label="Volume control">
          </div>
        </div>
      </div>

      <div class="progress-wrap">
        <div id="curTime" class="time">0:00</div>

        <div id="progress" aria-label="progress bar">
          <div id="progressBar"></div>
          <div id="thumb" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        </div>

        <div id="durTime" class="time">0:00</div>
      </div>
    </div>
  </div>

  <!-- Big Player Overlay -->
  <div id="bigPlayer" class="big-player-overlay" aria-hidden="true">
    <button id="closeBigPlayer" class="big-close-btn" title="Close">✕</button>

    <div class="big-cover">
      <img id="bigPlayerCover" src="" alt="">
    </div>

    <div id="bigPlayerTitle" class="big-title">—</div>
    <div id="bigPlayerArtist" class="big-artist">—</div>

    <div class="big-controls">
      <div class="controls" style="flex-wrap: wrap; justify-content: center; gap: 10px;">
        <button id="bigShuffle" class="control-btn" title="Shuffle">🔀</button>
        <button id="bigPrev" class="control-btn" title="Previous">⏮</button>
        <button id="bigPlay" class="control-btn" title="Play">▶</button>
        <button id="bigNext" class="control-btn" title="Next">⏭</button>
        <button id="bigLoop" class="control-btn" title="Loop">🔁</button>

        <button id="bigDownloadBtn" title="Download" style="display:none;" class="control-btn">
          <span class="material-symbols-outlined">download</span>
        </button>

        <button class="big-playlist-btn control-btn" title="Add to playlist">
          <i class="fas fa-plus"></i>
        </button>

        <div class="volume-container">
          <button id="bigMuteBtn" title="Mute / Unmute" class="control-btn">
            <i class="fa fa-volume-up"></i>
          </button>
          <div class="volume-slider-wrapper">
            <input type="range" class="volume-slider" id="bigVolumeSlider" min="0" max="100" value="100" 
                   aria-label="Volume control">
          </div>
        </div>
      </div>

      <div class="big-progress-wrap">
        <div id="bigCurTime" class="time">0:00</div>

        <div id="bigProgress" class="big-progress" aria-label="big progress">
          <div id="bigProgressBar" class="big-progress-bar"></div>
          <div id="bigThumb" class="big-thumb" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        </div>

        <div id="bigDurTime" class="time">0:00</div>
      </div>
    </div>
  </div>

  <!-- Hidden audio element -->
  <audio id="audioEl" preload="metadata"></audio>

  <!-- Playlist Modal -->
  <div class="modal fade" id="playlistModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="playlistModalTitle">Playlist</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="playlistTracks" class="track-list">
            <!-- Tracks will be loaded here -->
          </div>
          <div id="emptyPlaylist" class="text-center py-4" style="display: none;">
            <i class="fas fa-music fa-2x text-muted mb-2"></i>
            <p class="text-muted">No tracks in this playlist yet</p>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" id="deletePlaylistBtn">
            <i class="fas fa-trash me-2"></i>Delete Playlist
          </button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Create Playlist Modal -->
  <div class="modal fade create-playlist-modal" id="createPlaylistModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Create New Playlist</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="newPlaylistNameModal" class="form-label">Playlist Name</label>
            <input type="text" class="form-control" id="newPlaylistNameModal" placeholder="Enter playlist name..." maxlength="50">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="createPlaylistModalBtn">Create Playlist</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts in correct order -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Firebase Config -->
  <script src="firebase-config.js"></script>

  <!-- Media URL Helper (must load before music.js and playlist-spotify.js) -->
  <script src="media-url-helper.js"></script>

  <!-- User Authentication -->
  <script src="user-auth-playlist.js"></script>

  <!-- Playlist Management -->
  <script src="playlist-manager.js"></script>

  <!-- Music Player Logic from index.html -->
  <script src="music.js"></script>

  <!-- Spotify Style Playlist Enhancement -->
  <script src="playlist-spotify-new.js"></script>

  <!-- Additional Script for Create Playlist Modal -->
  <script>
    // Handle create playlist modal
    document.addEventListener('DOMContentLoaded', function() {
      const createPlaylistModalBtn = document.getElementById('createPlaylistModalBtn');
      const newPlaylistNameModal = document.getElementById('newPlaylistNameModal');
      
      if (createPlaylistModalBtn && newPlaylistNameModal) {
        createPlaylistModalBtn.addEventListener('click', function() {
          const name = newPlaylistNameModal.value.trim();
          
          if (!name) {
            alert('Please enter a playlist name');
            return;
          }

          if (name.length > 50) {
            alert('Playlist name must be 50 characters or less');
            return;
          }

          // Use the existing create playlist functionality
          const nameInput = document.getElementById('newPlaylistName');
          if (nameInput) {
            nameInput.value = name;
            // Trigger the create playlist function
            if (window.playlistManagerFixed && typeof window.playlistManagerFixed.createPlaylist === 'function') {
              window.playlistManagerFixed.createPlaylist();
            }
          }

          // Close the modal
          const modal = bootstrap.Modal.getInstance(document.getElementById('createPlaylistModal'));
          if (modal) {
            modal.hide();
          }
          
          // Clear the modal input
          newPlaylistNameModal.value = '';
        });

        // Enter key support for modal
        newPlaylistNameModal.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            createPlaylistModalBtn.click();
          }
        });
      }

      // Show create playlist modal when clicking the create card
      document.addEventListener('click', function(e) {
        if (e.target.closest('.create-playlist-card')) {
          const modal = new bootstrap.Modal(document.getElementById('createPlaylistModal'));
          modal.show();
          
          // Focus the input field
          setTimeout(() => {
            const input = document.getElementById('newPlaylistNameModal');
            if (input) {
              input.focus();
            }
          }, 500);
        }
      });
    });

    // Global function to show create playlist modal
    function showCreatePlaylistModal() {
      const modal = new bootstrap.Modal(document.getElementById('createPlaylistModal'));
      modal.show();
      
      // Focus the input field
      setTimeout(() => {
        const input = document.getElementById('newPlaylistNameModal');
        if (input) {
          input.focus();
        }
      }, 500);
    }
  </script>
</body>
</html>
