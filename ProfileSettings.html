<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Settings - Touhou Music</title>
  <link rel="icon" href="TH Reimu NOBG.ico" sizes="128x128" type="image/x-icon">
  
  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="profile.css">
  
  <!-- Firebase COMPAT Version -->
  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore-compat.js"></script>
</head>

<body>
  <div class="profile-container">
    <div class="profile-card">
      <!-- Header -->
      <div class="header-section">
        <a href="index.html" class="back-btn">
          <i class="fas fa-arrow-left me-2"></i>Back to Player
        </a>
        <h1 class="page-title">Profile Settings</h1>
        <p class="page-subtitle">Manage your account information</p>
      </div>

      <form id="profileForm">
        <!-- Username -->
        <div class="form-section">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Enter your username" required>
          <div class="form-text">This will be your display name throughout the app</div>
        </div>

        <!-- Email (Read-only) -->
        <div class="form-section">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" readonly>
          <div class="form-text">Email cannot be changed</div>
        </div>

        <!-- Save Button -->
        <div class="action-section">
          <button id="saveBtn" type="submit" class="btn btn-primary w-100">
            <i class="fas fa-save me-2"></i>Save Changes
          </button>
        </div>
      </form>

      <!-- Danger Zone -->
      <div class="danger-zone">
        <h3 class="danger-title">
          <i class="fas fa-exclamation-triangle me-2"></i>Danger Zone
        </h3>
        <div class="danger-actions">
          <button id="signOutBtn" class="btn btn-outline-warning">
            <i class="fas fa-sign-out-alt me-2"></i>Sign Out
          </button>
          <button id="deleteAccountBtn" class="btn btn-outline-danger">
            <i class="fas fa-trash me-2"></i>Delete Account
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Firebase Config -->
  <script src="firebase-config.js"></script>
  
  <!-- Profile Script -->
  <script src="profile.js"></script>
</body>
</html>
