<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Touhou Music</title>
  <link rel="icon" href="icon.png" type="image/png">
  
  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="register.css">
  
  <!-- Firebase COMPAT Version -->
  <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
</head>

<body>
  <div class="register-container">
    <div class="register-card">
      <!-- Logo & Title -->
      <div class="logo-section">
        <div class="logo">
          <i class="fas fa-music"></i>
        </div>
        <h1 class="title">Join Touhou Music</h1>
        <p class="subtitle">Create your account to start listening</p>
      </div>

      <form id="registerForm">
        <!-- Username -->
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Choose a username" required>
          <div class="form-text text-muted">This will be your display name</div>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Create a password" required>
          
          <!-- Password Requirements -->
          <div class="password-requirements">
            <div id="passwordRequirements" class="list-unstyled">
              <div id="uppercase" class="requirement-item">Uppercase letter</div>
              <div id="lowercase" class="requirement-item">Lowercase letter</div>
              <div id="number" class="requirement-item">Number</div>
              <div id="special" class="requirement-item">Special character</div>
              <div id="length" class="requirement-item">At least 8 characters</div>
            </div>
          </div>
        </div>
        
        <!-- Confirm Password -->
        <div class="mb-4">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password" required>
        </div>
        
        <!-- Submit Button -->
        <button id="submit" type="submit" class="btn btn-primary w-100 mb-3">
          <i class="fas fa-user-plus me-2"></i>Create Account
        </button>

        <!-- Google Register -->
        <button id="googleRegister" type="button" class="btn btn-google w-100">
          <i class="fab fa-google me-2"></i>Continue with Google
        </button>

        <!-- Already have account -->
        <div class="login-link text-center mt-3">
          <p>Already have an account? <a href="Login.html">Login here</a></p>
        </div>
      </form>

      <!-- Success Message -->
      <div id="successAlert" class="alert alert-success mt-3" style="display: none;">
        <i class="fas fa-check-circle me-2"></i>Account created successfully!
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Firebase Config -->
  <script src="firebase-config.js"></script>
  
  <!-- Register Script -->
  <script src="register.js"></script>
</body>
</html>
