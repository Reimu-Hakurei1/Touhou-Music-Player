name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src-tauri/**'
      - 'assets/**'
      - 'TH Reimu NOBG.ico'
      - 'package.json'
      - '.github/workflows/desktop-builds.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            script: dist:win
            artifacts: src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux x64
            os: ubuntu-24.04
            script: dist:linux
            artifacts: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
          - name: macOS universal
            os: macos-latest
            script: dist:mac
            artifacts: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf libfuse2t64 file

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal build targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: npm install

      - name: Build desktop package
        run: npm run ${{ matrix.script }}

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: Touhou-Music-Player-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish desktop release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: Touhou-Music-Player-*
          path: incoming
          merge-multiple: true

      - name: Prepare stable download names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          copy_first() {
            local pattern="$1"
            local destination="$2"
            local source
            source="$(find incoming -type f -iname "$pattern" -print -quit)"
            if [[ -z "$source" ]]; then
              echo "No package found matching $pattern" >&2
              exit 1
            fi
            cp "$source" "release/$destination"
          }
          copy_first '*.exe' 'Touhou-Music-Player-Windows-x64.exe'
          copy_first '*.dmg' 'Touhou-Music-Player-macOS-universal.dmg'
          copy_first '*.AppImage' 'Touhou-Music-Player-Linux-x64.AppImage'
          copy_first '*.deb' 'Touhou-Music-Player-Linux-x64.deb'

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Touhou Music Player $GITHUB_REF_NAME" --notes "Desktop installers for Windows, macOS, and Linux."
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
